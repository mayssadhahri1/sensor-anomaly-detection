name: setup

on: push

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          [ -f bundle.txt ] || exit 0
          python3 - <<'PY'
          import os, re
          data = open("bundle.txt", encoding="utf-8").read()
          parts = re.split(r"^=====FILE: (.+?)=====\n", data, flags=re.M)
          open("/tmp/msg", "w").write(parts[0].strip() or "Initial commit")
          for i in range(1, len(parts), 2):
              path = os.path.join("/tmp/p", parts[i])
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, "w", encoding="utf-8").write(parts[i + 1])
          PY
          git config user.name "Mayssa Dhahri"
          git config user.email "maissa.dhahri_1@polytechnicien.tn"
          git checkout --orphan clean
          git rm -rq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/p/. .
          git add -A
          git commit -qm "$(cat /tmp/msg)"
          git push -f origin clean:main
